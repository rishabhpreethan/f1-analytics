<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!--
    The grain tile — `DESIGN_SYSTEM.md` §7.7 layer 4.

    Its only job is to kill the gradient banding that an 80px-blurred orb otherwise shows on
    a wide display. It is **generated, not sourced**: `feTurbulence` is deterministic, so
    there is no licence question and nothing to attribute.

    Served from `public/` as a file rather than inlined as a `data:` URI so it is governed by
    `img-src 'self'` and stays out of the CSS artefact, which is on the critical path.

    `stitchTiles="stitch"` is what makes the 240px tile seamless when repeated; without it
    the seams are visible as a grid at exactly the tile size. `saturate 0` because the noise
    must not tint anything — the tile is applied with `mix-blend-mode: overlay` over layers
    that already carry the accent hue.
  -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch" />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <rect width="240" height="240" filter="url(#grain)" />
</svg>
